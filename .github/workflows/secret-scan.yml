name: Secret Scan

# Fails the PR (and the push to main) if a credential-shaped string is found.
# TruffleHog is free for organization-owned repos; on a pull_request it scans
# only the PR's commit range, and on push it scans the pushed range.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the diff range can always be resolved

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --results=verified,unknown
